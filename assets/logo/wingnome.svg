<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">WinGnome</title>
  <!--
    WinGnome app logo: a GNOME-style footprint whose heel is the four-pane Windows mark
    and whose toes are rounded window panes. Source of truth for the app icon; export
    PNG/ICO sizes from this file rather than editing them by hand.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea" />
      <stop offset="0.55" stop-color="#3584e4" />
      <stop offset="1" stop-color="#1a5fb4" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#deebfb" />
    </linearGradient>
    <!-- Cuts the heel into four panes. The mask sits in the heel's (already tilted) user space. -->
    <mask id="panes" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff" />
      <rect x="150" y="80" width="8" height="160" fill="#000" />
      <rect x="74" y="154" width="160" height="8" fill="#000" />
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dy="3" result="blur" />
      <feFlood flood-color="#0b3a75" flood-opacity="0.35" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Adwaita-style app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)" />
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)" />

  <g fill="url(#mark)" filter="url(#shadow)">
    <!-- Heel: the Windows four-pane mark -->
    <ellipse cx="154" cy="158" rx="54" ry="64" transform="rotate(-18 154 158)" mask="url(#panes)" />
    <!-- Toes: window panes, largest first, curling round the heel -->
    <rect x="114" y="38" width="42" height="42" rx="11" transform="rotate(-8 135 59)" />
    <rect x="68" y="70" width="34" height="34" rx="9" transform="rotate(-24 85 87)" />
    <rect x="45" y="114" width="28" height="28" rx="8" transform="rotate(-40 59 128)" />
    <rect x="44" y="162" width="23" height="23" rx="6" transform="rotate(-56 55.5 173.5)" />
  </g>
</svg>
